<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Estilos y Variables de Color -->
    <style>
        :root {
            --term-bg: #0a0f0a;
            --term-text: #4ade80;
            --term-border: #1f3f1f;
            --term-prompt: #45ff2c;
        }
        body.theme-amber {
            --term-bg: #1a1005;
            --term-text: #fbbf24;
            --term-border: #4a2c0a;
            --term-prompt: #f59e0b;
        }
        body.theme-purple {
            --term-bg: #140a1f;
            --term-text: #c084fc;
            --term-border: #4c1d95;
            --term-prompt: #a855f7;
        }
        body.theme-blue {
            --term-bg: #050b14;
            --term-text: #60a5fa;
            --term-border: #1e3a8a;
            --term-prompt: #3b82f6;
        }
        body.theme-white {
            --term-bg: #111111;
            --term-text: #d4d4d8;
            --term-border: #333333;
            --term-prompt: #ffffff;
        }

        .term-bg { background-color: var(--term-bg); }
        .term-text { color: var(--term-text); }
        .term-border { border-color: var(--term-border); }
        .term-prompt { color: var(--term-prompt); }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #18181b; }
        ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #52525b; }

        .pixel-video { image-rendering: pixelated; }

        .fade-in { animation: fadeIn .2s ease-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
        .cursor-blink { animation: blink 1s step-end infinite; }

        .crt::before {
            content: " "; display: block; position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.15) 50%);
            z-index: 20; background-size: 100% 2px; pointer-events: none;
        }

        /* --- ESTILOS MODO VIDEO --- */
        /* Ocultar UI y difuminar bordes */
        body.video-only header,
        body.video-only #main-layout,
        body.video-only footer {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        /* Aclarar el overlay del video para que se vea mejor */
        body.video-only #video-overlay {
            background-color: rgba(9, 9, 11, 0.2);
            transition: background-color 0.4s ease;
        }
        
        #video-overlay {
            background-color: rgba(9, 9, 11, 0.85);
            transition: background-color 0.4s ease;
        }
    </style>
</head>
