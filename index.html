<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Portfolio personal de proyectos y apuntes de programación.">
    <title>Portfolio</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&display=swap" rel="stylesheet">

    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Estilos y Variables de Color -->
    <style>
        :root {
            --term-bg: #0a0f0a;
            --term-text: #4ade80;
            --term-border: #1f3f1f;
            --term-prompt: #45ff2c;
        }
        body.theme-amber {
            --term-bg: #1a1005;
            --term-text: #fbbf24;
            --term-border: #4a2c0a;
            --term-prompt: #f59e0b;
        }
        body.theme-purple {
            --term-bg: #140a1f;
            --term-text: #c084fc;
            --term-border: #4c1d95;
            --term-prompt: #a855f7;
        }
        body.theme-blue {
            --term-bg: #050b14;
            --term-text: #60a5fa;
            --term-border: #1e3a8a;
            --term-prompt: #3b82f6;
        }
        body.theme-white {
            --term-bg: #111111;
            --term-text: #d4d4d8;
            --term-border: #333333;
            --term-prompt: #ffffff;
        }

        .term-bg { background-color: var(--term-bg); }
        .term-text { color: var(--term-text); }
        .term-border { border-color: var(--term-border); }
        .term-prompt { color: var(--term-prompt); }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #18181b; }
        ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #52525b; }

        .pixel-video { image-rendering: pixelated; }

        .fade-in { animation: fadeIn .2s ease-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
        .cursor-blink { animation: blink 1s step-end infinite; }

        .crt::before {
            content: " "; display: block; position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.15) 50%);
            z-index: 20; background-size: 100% 2px; pointer-events: none;
        }

        /* --- ESTILOS MODO VIDEO --- */
        /* Ocultar UI y difuminar bordes */
        body.video-only header,
        body.video-only #main-layout,
        body.video-only footer {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        /* Aclarar el overlay del video para que se vea mejor */
        body.video-only #video-overlay {
            background-color: rgba(9, 9, 11, 0.2);
            transition: background-color 0.4s ease;
        }
        
        #video-overlay {
            background-color: rgba(9, 9, 11, 0.85);
            transition: background-color 0.4s ease;
        }
    </style>
</head>

<body class="font-mono bg-zinc-950 text-zinc-100 min-h-screen antialiased flex flex-col relative transition-colors duration-300">

    <!-- VIDEO Y AUDIO DE FONDO -->
    <div class="fixed inset-0 w-full h-full -z-20 overflow-hidden pointer-events-none">
        <video id="bg-video" autoplay loop muted playsinline webkit-playsinline x5-playsinline preload="auto" class="w-full h-full object-cover pixel-video opacity-60">
            <source src="videos/speedrun_tetris.mp4" type="video/mp4">
        </video>
        <!-- Se añadió el id="video-overlay" -->
        <div id="video-overlay" class="absolute inset-0"></div>
    </div>
    
    <audio id="bg-audio" loop>
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
    </audio>

    <!-- Botón flotante para salir del Modo Video -->
    <button id="btn-exit-video-mode" class="hidden fixed bottom-8 right-8 z-50 px-5 py-3 rounded-full bg-zinc-900/80 border border-zinc-600 text-zinc-300 hover:text-white hover:bg-zinc-800 backdrop-blur-md shadow-2xl transition-all duration-300 transform hover:scale-105 flex items-center gap-2 text-sm font-medium">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5" />
        </svg>
        Salir del Modo Video
    </button>

    <!-- HEADER -->

        </svg>
    </div>

            Sebastián Pérez<span class="text-brand"></span>
        </h1>
        <p class="text-[11px] sm:text-xs text-zinc-400 tracking-wide mt-1 font-mono flex flex-wrap items-center gap-1.5">

            <span class="text-zinc-600">|</span>
            <span>IBM i (AS/400)</span>
            <span class="text-brand/60">|</span>
            <span>COBOL</span>
            <span class="text-brand/60">|</span>
            <span>SQL</span>
        </p>
    </div>
</div>

            

            <div class="flex items-center gap-2 sm:gap-3">
                <button id="btn-settings" class="flex items-center gap-2 px-3 py-1.5 rounded-md border border-zinc-700 hover:border-zinc-500 text-zinc-400 hover:text-white transition-colors text-sm">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                    </svg>
                    <span class="hidden sm:inline">Ajustes</span>
                </button>
            </div>
        </div>

        <!-- Panel de Preferencias -->
        <div id="settings-panel" class="hidden absolute top-16 right-4 sm:right-6 w-72 bg-zinc-900 border border-zinc-700 rounded-xl shadow-2xl p-4 backdrop-blur-xl">
            <h3 class="text-sm font-bold text-white mb-3 border-b border-zinc-700 pb-2">Preferencias</h3>
            
            <div class="flex items-center justify-between mb-4">
                <span class="text-xs text-zinc-400">Música de fondo</span>
                <button id="btn-music" class="px-3 py-1 rounded-md text-xs font-medium bg-zinc-800 text-zinc-300 hover:bg-zinc-700 transition">OFF</button>
            </div>

            <!-- NUEVA OPCIÓN: MODO VIDEO -->
            <div class="flex items-center justify-between mb-4">
                <span class="text-xs text-zinc-400">Modo Video (Ocultar UI)</span>
                <button id="btn-video-mode" class="px-3 py-1 rounded-md text-xs font-medium bg-zinc-800 text-zinc-300 hover:bg-zinc-700 transition">OFF</button>
            </div>

            <div>
                <span class="text-xs text-zinc-400 block mb-2">Color de Terminal</span>
                <div class="grid grid-cols-4 gap-2">
                    <button data-theme="theme-green" class="w-full h-8 rounded border border-zinc-600 bg-[#0a0f0a] hover:scale-105 transition-transform flex items-center justify-center"><span class="w-3 h-3 rounded-full bg-[#4ade80]"></span></button>
                    <button data-theme="theme-purple" class="w-full h-8 rounded border border-zinc-600 bg-[#140a1f] hover:scale-105 transition-transform flex items-center justify-center"><span class="w-3 h-3 rounded-full bg-[#c084fc]"></span></button>
                    <button data-theme="theme-blue" class="w-full h-8 rounded border border-zinc-600 bg-[#050b14] hover:scale-105 transition-transform flex items-center justify-center"><span class="w-3 h-3 rounded-full bg-[#60a5fa]"></span></button>
                    <button data-theme="theme-white" class="w-full h-8 rounded border border-zinc-600 bg-[#111111] hover:scale-105 transition-transform flex items-center justify-center"><span class="w-3 h-3 rounded-full bg-[#d4d4d8]"></span></button>
                </div>
            </div>
        </div>
    </header>

    <!-- LAYOUT PRINCIPAL (Se le añadió el id="main-layout") -->
    <div id="main-layout" class="flex-1 w-full max-w-7xl mx-auto px-4 sm:px-6 py-8 flex flex-col lg:flex-row gap-6 relative z-10 transition-opacity duration-400">
        <aside id="reviews-sidebar" class="w-full lg:w-[320px] flex-shrink-0 order-2 lg:order-1">
            <div class="rounded-xl border border-zinc-800/80 bg-zinc-950/60 backdrop-blur-sm p-4 shadow-lg h-full flex flex-col">
                <button id="btn-toggle-reviews" class="flex items-center justify-between w-full text-xs uppercase tracking-wider text-zinc-400 mb-3 font-bold hover:text-white transition-colors group">
                    <span>Reviews</span>
                    <svg id="icon-expand" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4 transition-transform duration-300 group-hover:text-brand">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" />
                    </svg>
                </button>
                <div id="reviews-list" class="space-y-3 flex-1 overflow-y-auto max-h-[500px] pr-1"></div>
                <div id="review-form-container" class="hidden mt-4 pt-4 border-t border-zinc-800/80 transition-all duration-500">
                    <form id="review-form" class="space-y-3">
                        <div>
                            <label for="review-name" class="block text-[11px] font-medium text-zinc-400 mb-1">Nombre:</label>
                            <input type="text" id="review-name" required maxlength="20" placeholder="Tu nombre o alias..." class="w-full bg-zinc-900/50 border border-zinc-700 rounded px-2 py-1.5 text-sm text-white placeholder-zinc-600 focus:outline-none focus:border-brand transition-all">
                        </div>
                        <div>
                            <label for="review-text" class="block text-[11px] font-medium text-zinc-400 mb-1">Opinión:</label>
                            <textarea id="review-text" required rows="3" maxlength="120" placeholder="Escribe tu opinión aquí..." class="w-full bg-zinc-900/50 border border-zinc-700 rounded px-2 py-1.5 text-sm text-white placeholder-zinc-600 focus:outline-none focus:border-brand transition-all resize-none"></textarea>
                        </div>
                        <button type="submit" class="w-full py-1.5 text-sm font-medium bg-zinc-800 text-zinc-300 rounded hover:bg-brand hover:text-zinc-950 transition-colors border border-zinc-700 hover:border-brand">Enviar Opinión</button>
                    </form>
                </div>
            </div>
        </aside>

        <main id="content" class="order-1 lg:order-2 flex-1 min-h-[60vh]"></main>
    </div>

    <footer class="border-t border-zinc-800/50 mt-auto relative z-10 bg-zinc-950/50 backdrop-blur-sm transition-opacity duration-400">

Sebastián Pérez</span>
